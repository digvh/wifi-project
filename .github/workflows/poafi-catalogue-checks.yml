name: PoaFi catalogue checks

on:
  pull_request:
    paths:
      - "poafi-backend/**"
      - "poafi-frontend/**"
      - "poafi-radius/**"
      - ".github/workflows/poafi-catalogue-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend TypeScript and Prisma validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poafi-backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poafi_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poafi-backend/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run network integration tests
        run: npm test
      - name: Compile backend
        run: npm run build

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poafi-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poafi-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  radius:
    name: FreeRADIUS container configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FreeRADIUS image
        run: docker build -t poafi-radius-check ./poafi-radius
      - name: Validate FreeRADIUS configuration
        run: |
          docker run --rm \
            -e POAFI_API_URL=http://127.0.0.1:4000 \
            -e RADIUS_REST_SHARED_SECRET=ci-only-secret-value-which-is-at-least-32-chars \
            --entrypoint freeradius \
            poafi-radius-check -XC
